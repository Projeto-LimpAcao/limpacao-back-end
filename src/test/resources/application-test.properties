# Perfil de testes: H2 em memoria no modo PostgreSQL (nao precisa de Docker).
# O Flyway roda a mesma migration de producao e o Hibernate valida o schema,
# entao o teste quebra se uma entidade ficar diferente da migration.
spring.datasource.url=jdbc:h2:mem:limpacao;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
limpacao.uploads.diretorio=target/test-uploads
