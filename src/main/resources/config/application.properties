management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.roles=ADMIN

management.health.ssl.enabled=false

management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
management.endpoint.health.status.http-mapping.DOWN=503
management.endpoint.health.status.http-mapping.OUT_OF_SERVICE=503
management.endpoint.health.status.http-mapping.DEGRADED=200

management.endpoint.health.cache.time-to-live=10s

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

limpacao.admin.emails=${ADMIN_EMAILS:limpacao.projeto@gmail.com}

limpacao.admin.email=${ADMIN_EMAIL:limpacao.projeto@gmail.com}
limpacao.admin.senha=${ADMIN_SENHA:Limpacao@2026#}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
