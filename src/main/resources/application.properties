spring.application.name=limpacao_backend

server.port=${PORT:8080}


spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:limpacao}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET:limpacao-secret-key-change-in-production-2024}
jwt.expiration=${JWT_EXPIRATION:86400000}

limpacao.cors.origens=${CORS_ORIGINS:http://localhost:5173}

# Actuator (health check, info) e administrador: ver src/main/resources/config/application.properties

# E-mail via API HTTP do Brevo (o Render bloqueia SMTP).
limpacao.mail.brevo.api-key=${BREVO_API_KEY:}
limpacao.mail.remetente=${MAIL_REMETENTE:}
limpacao.mail.nome-remetente=LimpA\u00e7\u00e3o

limpacao.uploads.diretorio=${UPLOADS_DIR:uploads}
# Swagger (springdoc): interface em /swagger-ui.html e JSON em /v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true
# No Render a API fica atras de um proxy HTTPS: usa os cabecalhos X-Forwarded-*
# para o Swagger gerar a URL do servidor com https.
server.forward-headers-strategy=framework
